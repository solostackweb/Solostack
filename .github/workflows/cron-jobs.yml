name: Cron jobs

# Replaces Vercel Cron (Pro-only). Calls the existing Next.js cron
# API routes via HTTP. All endpoints are protected by the CRON_SECRET
# env var — add it to your GitHub repo:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name:  CRON_SECRET
#   Value: (same value as your Vercel/production CRON_SECRET env var)
#
# APP_URL is also required:
#   Name:  APP_URL
#   Value: https://stackivo.me  (no trailing slash)

on:
  schedule:
    # ── Daily invoice reminders ─────────────────────────────────────────
    # Due-soon: 3:00 UTC = 8:30 AM IST
    - cron: "0 3 * * *"
    # Overdue:  3:30 UTC = 9:00 AM IST
    - cron: "30 3 * * *"
    # Subscription renewal reminders: 3:15 UTC = 8:45 AM IST
    - cron: "15 3 * * *"
    # ── Admin export (hourly) ───────────────────────────────────────────
    - cron: "0 * * * *"
    # ── Operational monitor (every 15 min) ──────────────────────────────
    - cron: "*/15 * * * *"
    # ── Weekly portal digest (Mondays 04:00 UTC = 9:30 AM IST) ───────────
    - cron: "0 4 * * 1"
    # ── Data retention cleanup (daily 4:30 UTC = 10:00 AM IST) ───────────
    - cron: "30 4 * * *"
    # ── Account purge (deletion grace elapsed) daily 5:00 UTC = 10:30 IST ─
    - cron: "0 5 * * *"
  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "invoices-overdue"
        type: choice
        options:
          - invoices-overdue
          - invoices-due-soon
          - subscription-renewals
          - admin-export
          - monitor
          - portal-digest
          - retention
          - account-purge

# Shared curl helper — defined once, reused by every job via env
env:
  # Prefer CRON_BASE_URL (the Vercel *.vercel.app origin, which is NOT
  # proxied through Cloudflare) so scheduled curl calls bypass Bot Fight
  # Mode's managed challenge. Falls back to APP_URL if the secret is unset.
  #   Name:  CRON_BASE_URL
  #   Value: https://<your-project>.vercel.app  (no trailing slash)
  BASE_URL: ${{ secrets.CRON_BASE_URL || secrets.APP_URL }}
  SECRET:   ${{ secrets.CRON_SECRET }}

jobs:
  # ── Due-soon reminder (daily at 3:00 UTC) ────────────────────────────────
  invoices-due-soon:
    name: Invoice due-soon reminders
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'invoices-due-soon') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    steps:
      - name: Call /api/cron/invoices-due-soon
        run: |
          echo "Calling: $BASE_URL/api/cron/invoices-due-soon"
          HTTP_CODE=$(curl -s -L --location-trusted -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer $SECRET" \
            "$BASE_URL/api/cron/invoices-due-soon")
          BODY=$(cat /tmp/body.txt)
          echo "HTTP status : $HTTP_CODE"
          echo "Response    : $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Endpoint returned HTTP $HTTP_CODE — $BODY"
            exit 1
          fi

  # ── Subscription renewal reminders (daily at 3:15 UTC) ───────────────────
  subscription-renewals:
    name: Subscription renewal reminders
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'subscription-renewals') ||
      (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *')
    steps:
      - name: Call /api/cron/subscription-renewals
        run: |
          echo "Calling: $BASE_URL/api/cron/subscription-renewals"
