<!--
  Maskable variant: keeps the brand mark inside the safe zone (40% inner radius)
  so platform-specific masks (circle, squircle, rounded square) don't crop the
  glyph. Background fills the full canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- Content scaled to 75 % and centred — keeps bars inside PWA safe zone -->
  <g transform="translate(64,64) scale(0.75)">
    <!-- Bar 1 — full width -->
    <rect x="88" y="96"  width="336" height="68" rx="34" fill="#FFFFFF"/>
    <!-- Bar 2 — 72 % width -->
    <rect x="88" y="228" width="242" height="68" rx="34" fill="#FFFFFF" opacity="0.72"/>
    <!-- Bar 3 — 47 % width -->
    <rect x="88" y="360" width="158" height="68" rx="34" fill="#FFFFFF" opacity="0.40"/>
  </g>
</svg>
